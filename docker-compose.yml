services:
  secure-data-tools:
    build:
      context: .
      network: host
    image: secure-data-tools:latest
    container_name: secure-data-tools
    ports:
      - "8082:80"
      - "12443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx.crt:/etc/nginx/ssl/nginx.crt:ro
      - ./nginx.key:/etc/nginx/ssl/nginx.key:ro
    restart: always

networks:
  default:
    name: global-link
    external: true
